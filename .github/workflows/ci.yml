name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Conferir encoding dos arquivos de texto
        run: python tools/verificar_encoding.py

      - name: Verificar que o pacote importa
        run: python -c "import vmslabs; print('vmslabs ok')"

      - name: Rodar testes com cobertura
        run: python -m pytest --cov=vmslabs --cov-report=term-missing --cov-report=xml

      - name: Conferir cobertura minima
        run: python -m coverage report --fail-under=70

      - name: Prova de aceite
        run: python tools/verificar_aceite.py

      # Duas coisas do runner do GitHub brigam com o passo abaixo, e as duas
      # precisam ser neutralizadas:
      # 1) no pwsh 7.4+, `PSNativeCommandUseErrorActionPreference` faz um
      #    comando nativo com codigo != 0 virar erro terminante e abortar o
      #    passo antes do `if` que confere o codigo;
      # 2) o runner fecha o passo com `exit $LASTEXITCODE`, entao o codigo 1
      #    esperado da CLI viraria o codigo do passo.
      - name: O fluxo detecta os incidentes com saida diferente de zero
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          python -m vmslabs correlacionar dados/eventos-vms.jsonl dados/eventos-acesso.jsonl --regras dados/regras-incidente.yaml
          if ($LASTEXITCODE -eq 0) {
            Write-Error "havendo incidente, o CLI deveria sair com 1"
            exit 1
          }
          Write-Output "ok: incidentes sinalizados com codigo diferente de zero"
          exit 0

      - name: O exemplo esta atualizado
        run: |
          python -m vmslabs correlacionar dados/eventos-vms.jsonl dados/eventos-acesso.jsonl --regras dados/regras-incidente.yaml --saida exemplos/incidentes-detectados.md
          git diff --exit-code -- exemplos/incidentes-detectados.md