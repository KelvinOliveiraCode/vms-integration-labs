[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vmslabs"
version = "1.0.0"
description = "Analise local de fatura ficticia de nuvem: atribuicao por projeto, deteccao de anomalias e projecao fim de mes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["vmslabs", "vms", "cftv", "controle-de-acesso", "correlacao", "auditoria"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
# Zero dependencia de execucao. O CSV e lido com o modulo csv da biblioteca
# padrao, a estatistica usa statistics, e o resto e aritmetica. Nada acessa
# nuvem: os servicos sao nomes numa fatura ficticia.
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
vmslabs = "vmslabs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["vmslabs"]

[tool.coverage.report]
show_missing = true
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise SystemExit",
    "if TYPE_CHECKING:",
]